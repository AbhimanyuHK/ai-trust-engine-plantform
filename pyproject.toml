[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-trust-engine"
version = "0.2.0"
description = "Snowflake-native AI TRUST Engine workflows"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "pydantic-settings>=2.2,<3", "PyYAML>=6.0", "pandas>=2.1", "numpy>=1.26", "snowflake-connector-python[pandas]>=3.10", "scikit-learn>=1.4", "xgboost>=2.0", "pypdf>=4.2", "python-dateutil>=2.9", "typer>=0.12", "rich>=13.7"]
[project.optional-dependencies]
agent = ["langgraph>=0.2", "langgraph-checkpoint-sqlite>=2.0"]
ui = ["streamlit>=1.35", "plotly>=5.22"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.3"]
lstm = ["tensorflow>=2.16"]
observability = ["langsmith>=0.1"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
[project.scripts]
trust-engine = "trust_engine.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py310"
